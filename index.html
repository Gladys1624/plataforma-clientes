<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATAFORMA CLIENTES</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#18231d}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:#edf3ef}.box{width:390px;background:#fff;padding:38px;border-radius:18px;box-shadow:0 18px 60px #173f2a18}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;background:#17663f;color:#fff;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{display:block}.brand small{color:#748078}.login h1{font-size:25px;margin:30px 0 6px}.login p{color:#748078;font-size:13px}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid #d8e0db;border-radius:9px}.primary{padding:12px 16px;background:#17663f;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.login .primary{width:100%;margin-top:8px}.error{color:#a33d2c;font-size:12px;margin-top:8px}.notice{margin-top:12px;padding:10px;border-radius:8px;background:#edf7f1;color:#17663f;font-size:11px}.app{display:none}.top{height:70px;background:#fff;border-bottom:1px solid #e0e6e2;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.top-right{font-size:13px;color:#66736b}.logout,.secondary{margin-left:10px;padding:8px 11px;border:1px solid #d7dfda;background:#fff;border-radius:8px;cursor:pointer}.layout{display:grid;grid-template-columns:285px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #e0e6e2;padding:20px 14px}.label{font-size:10px;font-weight:800;color:#89938d;letter-spacing:1px;margin:12px 9px 7px}.company{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:9px;background:#fff}.folder{width:100%;border:0;background:#fff;text-align:left;padding:11px;border-radius:9px;margin:2px 0;color:#4c5a52;cursor:pointer}.folder.active{background:#eaf4ee;color:#17663f;font-weight:700}.folder small{float:right;color:#8b958f}.sub{padding-left:28px;font-size:12px}.newsub{width:100%;padding:8px;border:1px dashed #b8c8bf;background:#fafcfb;color:#17663f;border-radius:8px;cursor:pointer;margin:5px 0}.backup{width:100%;margin-top:10px;padding:9px;border:1px solid #d7dfda;background:#fff;border-radius:8px;cursor:pointer;font-size:12px}.backup:hover{background:#f4f8f5}main{padding:30px;max-width:1450px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:10px;color:#17663f;font-weight:800;letter-spacing:1px}.hero h1{font-size:30px;margin:5px 0}.hero p{color:#748078;margin:0}.actions{display:flex;gap:8px}.ai{background:#17663f;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.outline{background:#fff;color:#17663f;border:1px solid #17663f;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e0e6e2;border-radius:13px}.card{padding:16px}.card small{color:#849089;font-size:10px;font-weight:800}.card strong{display:block;font-size:24px;margin:7px 0}.card span{font-size:11px;color:#748078}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #edf0ee;padding-bottom:12px;margin-bottom:13px}.panel h2{font-size:14px;margin:0 0 4px}.panel p{font-size:12px;color:#77827b;margin:0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid #dce4df;background:#f8faf9;border-radius:10px;padding:14px;text-align:left;cursor:pointer}.quick b{display:block;font-size:12px}.quick span{display:block;font-size:11px;color:#718078;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;color:#818c85;padding:9px;border-bottom:1px solid #dfe5e1}td{padding:11px 9px;border-bottom:1px solid #edf0ee}.pill{font-size:9px;font-weight:800;color:#17663f}.empty{padding:25px;text-align:center;color:#7a867f;font-size:12px}.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:10}.modalbox{width:min(650px,92vw);max-height:90vh;overflow:auto;background:#fff;padding:25px;border-radius:14px}.modalbox h2{margin-top:0}.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:8px;margin:6px 0}.row{display:flex;gap:9px;margin-top:10px}.result{margin-top:14px;background:#f5f8f6;border-radius:9px;padding:15px;font-size:12px;line-height:1.55}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.cards,.quick{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards,.quick{grid-template-columns:1fr}main{padding:18px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="login"><div class="box"><div class="brand"><div class="mark">P</div><div><b>PLATAFORMA CLIENTES</b><small>Gestión inteligente integral</small></div></div><h1>Ingreso privado</h1><p>Acceso para tu equipo.</p><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button class="primary" onclick="login()">Ingresar</button><div id="err" class="error"></div></div></div>
<div id="app" class="app"><header class="top"><div class="brand"><div class="mark">P</div><div><b>PLATAFORMA CLIENTES</b><small>Gestión inteligente integral</small></div></div><div class="top-right"><span id="who"></span><button class="logout" onclick="logout()">Salir</button></div></header><div class="layout"><aside><div class="label">EMPRESA</div><select id="company" class="company"></select><button class="outline" style="width:100%;margin-top:8px" onclick="newCompany()">＋ Nueva empresa</button><div class="label">EXPEDIENTE</div><div id="folders"></div><button class="backup" onclick="downloadBackup()">💾 Descargar respaldo</button><button class="backup" onclick="restoreBackup()">↩ Restaurar respaldo</button></aside><main id="main"></main></div></div>
<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><input id="restoreFile" type="file" accept="application/json" style="display:none">
<script>
const KEY='pc_v8';
const F=[['01','ORGANIZACIÓN'],['02','PLANIFICACIÓN'],['03','APLICACIÓN'],['04','VERIFICACIÓN'],['05','MEJORAMIENTO'],['06','POLÍTICAS']];
const base={companies:[{id:'wonder',name:'WONDER PACK S.A.S.',nit:'',city:'Medellín',employees:30,risk:'IV',arl:'ARL SURA',subfolders:{}}],docs:[],alerts:[]};
function readOld(){for(const k of ['pc_v7','pc_v6','pc_v5','pc_v4','pc_v3']){try{const r=localStorage.getItem(k);if(r){const x=JSON.parse(r);if(x&&Array.isArray(x.companies))return x}}catch(e){}}return null}
function normalize(s){s=s||{};s.companies=Array.isArray(s.companies)?s.companies:[];s.docs=Array.isArray(s.docs)?s.docs:[];s.alerts=Array.isArray(s.alerts)?s.alerts:[];if(!s.companies.length)s.companies=[...base.companies];s.companies.forEach(c=>{c.subfolders=c.subfolders||{};F.forEach(f=>{if(!Array.isArray(c.subfolders[f[0]]))c.subfolders[f[0]]=[]})});s.docs=s.docs.map(d=>({...d,companyId:d.companyId||d.company||'wonder',folder:d.folder||'01',subfolder:d.subfolder||''}));return s}
let state=normalize(JSON.parse(localStorage.getItem(KEY)||'null')||readOld()||base),active='01',cid=state.companies[0]?.id||'wonder',subactive='';
if(!localStorage.getItem(KEY)){localStorage.setItem(KEY,JSON.stringify(state));}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function current(){return state.companies.find(x=>x.id==cid)||state.companies[0]}function subs(){let c=current();c.subfolders=c.subfolders||{};c.subfolders[active]=c.subfolders[active]||[];return c.subfolders[active]}
function login(){let u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;if((u=='gladys'&&p=='GladysPro2026!')||(u=='empleada'&&p=='Empleada2026!')){localStorage.pc5='1';localStorage.user5=u;show()}else document.getElementById('err').textContent='Usuario o contraseña incorrectos.'}
function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').textContent=localStorage.user5||'gladys';let cs=document.getElementById('company');cs.innerHTML=state.companies.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');if(!state.companies.some(c=>c.id==cid))cid=state.companies[0].id;cs.value=cid;cs.onchange=()=>{cid=cs.value;active='01';subactive='';render()};document.getElementById('folders').innerHTML=F.map(x=>{let open=x[0]==active;return `<button class="folder ${open&&!subactive?'active':''}" onclick="setFolder('${x[0]}')">${x[0]} · ${x[1]} <small>${state.docs.filter(d=>d.companyId==cid&&d.folder==x[0]).length}</small></button>${open?`<button class="newsub" onclick="newSubfolder()">＋ Nueva subcarpeta</button>${subs().map(s=>`<button class="folder sub ${subactive==s.id?'active':''}" onclick="setSub('${s.id}')">📁 ${s.name}<small>${state.docs.filter(d=>d.companyId==cid&&d.folder==active&&d.subfolder==s.id).length}</small></button>`).join('')}`:''}`).join('');render()}
function setFolder(x){active=x;subactive='';show()}function setSub(x){subactive=x;show()}function docs(){return state.docs.filter(d=>d.companyId==cid&&d.folder==active&&(!subactive||d.subfolder==subactive))}
function render(){let c=current(),f=F.find(x=>x[0]==active),s=subs().find(x=>x.id==subactive),list=docs();document.getElementById('main').innerHTML=`<div class="hero"><div><span class="eyebrow">${f[1]}${s?' · '+s.name:''}</span><h1>${c.name}</h1><p>${c.city||'Ciudad por definir'} · ${c.employees||0} trabajadores · Riesgo ${c.risk||'Por definir'} · ${c.arl||'Por definir'}</p></div><div class="actions"><button class="outline" onclick="newSubfolder()">＋ Nueva subcarpeta</button><button class="ai" onclick="openAI()">✦ Asistente IA</button></div></div><div class="cards"><div class="card"><small>TRABAJADORES</small><strong>${c.employees||0}</strong><span>Centro de trabajo</span></div><div class="card"><small>CARPETAS</small><strong>6</strong><span>estructura fija</span></div><div class="card"><small>SUBCARPETAS</small><strong>${F.reduce((n,x)=>n+(c.subfolders&&c.subfolders[x[0]]?c.subfolders[x[0]].length:0),0)}</strong><span>creadas</span></div><div class="card"><small>DOCUMENTOS</small><strong>${state.docs.filter(d=>d.companyId==cid).length}</strong><span>registrados</span></div></div><section class="panel"><div class="panel-head"><div><h2>${s?'📁 '+s.name:f[1]}</h2><p>${s?'Documentos de esta subcarpeta.':'Puedes crear y organizar documentos aquí.'}</p></div><button class="outline" onclick="newDoc()">＋ Crear documento</button></div>${list.length?`<table><thead><tr><th>CÓDIGO</th><th>NOMBRE</th><th>TIPO</th><th>VERSIÓN</th><th>ESTADO</th></tr></thead><tbody>${list.map(d=>`<tr><td>${d.code||'—'}</td><td>${d.name}</td><td>${d.type||'CARGADO'}</td><td>${d.version||'01'}</td><td><span class="pill">${d.status||'REGISTRADO'}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No hay documentos registrados en esta ubicación.</div>'}</section><section class="panel"><div class="panel-head"><div><h2>ACCIONES RÁPIDAS</h2><p>Trabaja sobre el expediente de la empresa.</p></div></div><div class="quick"><button onclick="newDoc()"><b>📄 Crear documento</b><span>Guardar en la carpeta actual.</span></button><button onclick="uploadDoc()"><b>📎 Registrar documento cargado</b><span>Asociarlo a empresa, carpeta y subcarpeta.</span></button><button onclick="openAI()"><b>🤖 Asistente IA</b><span>Preparar una solicitud documental.</span></button></div></section>`}
function modal(t,b){document.getElementById('modalbox').innerHTML=`<h2>${t}</h2>${b}`;document.getElementById('modal').style.display='grid'}function closeM(){document.getElementById('modal').style.display='none'}
function newSubfolder(){let f=F.find(x=>x[0]==active);modal('📁 Nueva subcarpeta',`<p>Dentro de <b>${f[1]}</b> para <b>${current().name}</b>.</p><input id="sname" placeholder="Ej.: 01.01 Información general"><input id="scode" placeholder="Código opcional"><div class="row"><button class="primary" onclick="saveSubfolder()">Crear subcarpeta</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function saveSubfolder(){let n=document.getElementById('sname').value.trim();if(!n)return alert('Escribe el nombre de la subcarpeta.');let id='s'+Date.now();subs().push({id,name:n,code:document.getElementById('scode').value.trim()});save();subactive=id;closeM();show()}
function newCompany(){modal('🏢 Crear nueva empresa',`<p>La empresa se agregará sin borrar las que ya existen.</p><input id="cname" placeholder="Razón social / nombre"><input id="cnit" placeholder="NIT"><input id="ccity" placeholder="Ciudad"><input id="cemployees" type="number" min="1" placeholder="Trabajadores"><select id="crisk"><option value="">Clase de riesgo</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option></select><input id="carl" placeholder="ARL"><div class="row"><button class="primary" onclick="saveCompany()">Crear empresa</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function saveCompany(){let n=document.getElementById('cname').value.trim();if(!n)return alert('Escribe el nombre.');let id='c'+Date.now(),c={id,name:n,nit:document.getElementById('cnit').value.trim(),city:document.getElementById('ccity').value.trim(),employees:+document.getElementById('cemployees').value||0,risk:document.getElementById('crisk').value||'Por definir',arl:document.getElementById('carl').value.trim()||'Por definir',subfolders:{}};F.forEach(f=>c.subfolders[f[0]]=[]);state.companies.push(c);cid=id;active='01';subactive='';save();closeM();show()}
function newDoc(){let f=F.find(x=>x[0]==active),s=subs().find(x=>x.id==subactive);modal('📄 Crear documento',`<p>Destino: <b>${f[1]}${s?' / '+s.name:''}</b></p><select id="dtype"><option>Procedimiento</option><option>Programa</option><option>Política</option><option>Formato</option><option>Acta</option><option>Informe</option><option>Plan</option><option>Manual</option><option>Matriz</option></select><input id="dname" placeholder="Nombre del documento"><input id="dcode" placeholder="Código"><div class="row"><button class="primary" onclick="saveDoc()">Crear y guardar</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function saveDoc(){let n=document.getElementById('dname').value.trim()||'Documento sin nombre';state.docs.push({id:Date.now(),companyId:cid,folder:active,subfolder:subactive,type:document.getElementById('dtype').value,name:n,code:document.getElementById('dcode').value.trim()||'POR-ASIGNAR',version:'01',status:'BORRADOR'});save();closeM();show()}
function uploadDoc(){modal('📎 Registrar documento cargado',`<p>Empresa: <b>${current().name}</b><br>Destino: <b>${F.find(x=>x[0]==active)[1]}${subactive?' / '+subs().find(s=>s.id==subactive)?.name:''}</b></p><input id="up" type="file"><div class="row"><button class="primary" onclick="storeUpload()">Registrar</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function storeUpload(){let file=document.getElementById('up').files[0];if(!file)return alert('Selecciona un archivo.');state.docs.push({id:Date.now(),companyId:cid,folder:active,subfolder:subactive,type:'CARGADO',name:file.name,code:'CARGADO',version:'01',status:'CARGADO'});save();closeM();show()}
function openAI(){let f=F.find(x=>x[0]==active),s=subs().find(x=>x.id==subactive);modal('🤖 Asistente IA',`<p>Empresa: <b>${current().name}</b><br>Destino: <b>${f[1]}${s?' / '+s.name:''}</b></p><textarea id="q" style="height:130px" placeholder="Escribe qué documento necesitas"></textarea><div class="row"><button class="primary" onclick="askAI()">Procesar solicitud</button><button class="secondary" onclick="closeM()">Cerrar</button></div><div id="aout"></div>`)}function askAI(){let q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('aout').innerHTML=`<div class="result"><b>Solicitud preparada</b><br><br>${q.replaceAll('<','&lt;')}<br><br>La generación automática del archivo final se conectará al servicio IA del servidor.</div>`}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo-plataforma-clientes.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(){const i=document.getElementById('restoreFile');i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));cid=state.companies[0].id;active='01';subactive='';save();show();alert('Respaldo restaurado correctamente.')}catch(e){alert('El respaldo no es válido.')}};r.readAsText(f)};i.click()}
function logout(){localStorage.removeItem('pc5');location.reload()}if(localStorage.pc5=='1')show();
</script></body></html>
