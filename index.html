<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLATAFORMA CLIENTES</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#18231d}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center}.box,.panel{background:#fff;border:1px solid #e0e6e2;border-radius:14px}.box{width:390px;padding:38px}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid #d8e0db;border-radius:9px}.primary{padding:12px 16px;background:#17663f;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.app{display:none}.top{height:70px;background:#fff;border-bottom:1px solid #e0e6e2;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #e0e6e2;padding:18px 14px}.company{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:9px}.folder{width:100%;border:0;background:#fff;text-align:left;padding:11px;border-radius:8px;margin:2px 0;cursor:pointer}.folder.active{background:#eaf4ee;color:#17663f;font-weight:700}.folder small{float:right}.sub{padding-left:28px;font-size:12px}.newsub{width:100%;padding:8px;border:1px dashed #b8c8bf;background:#fafcfb;color:#17663f;border-radius:8px;cursor:pointer;margin:5px 0}.label{font-size:10px;font-weight:800;color:#89938d;letter-spacing:1px;margin:12px 8px 7px}main{padding:30px;max-width:1400px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between}.actions{display:flex;gap:8px}.outline,.secondary{background:#fff;color:#17663f;border:1px solid #17663f;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.ai{background:#17663f;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{padding:15px;background:#fff;border:1px solid #e0e6e2;border-radius:12px}.card strong{display:block;font-size:23px;margin:6px 0}.panel{padding:20px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;border-bottom:1px solid #edf0ee;padding-bottom:12px;margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0ee}.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:10}.modalbox{width:min(620px,92vw);background:#fff;padding:24px;border-radius:14px}.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:8px;margin:6px 0}.row{display:flex;gap:8px;margin-top:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}.cards{grid-template-columns:1fr 1fr}}@media(max-width:550px){.cards{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="box"><h2>PLATAFORMA CLIENTES</h2><p>Ingreso privado</p><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button class="primary" style="width:100%" onclick="login()">Ingresar</button><div id="err"></div></div></div><div id="app" class="app"><header class="top"><b>PLATAFORMA CLIENTES</b><span id="who"></span><button class="secondary" onclick="logout()">Salir</button></header><div class="layout"><aside><div class="label">EMPRESA</div><select id="company" class="company"></select><button class="outline" style="width:100%;margin-top:8px" onclick="newCompany()">＋ Nueva empresa</button><div class="label">EXPEDIENTE</div><div id="folders"></div></aside><main id="main"></main></div></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><script>const KEY='pc_v7',F=[['01','ORGANIZACIÓN'],['02','PLANIFICACIÓN'],['03','APLICACIÓN'],['04','VERIFICACIÓN'],['05','MEJORAMIENTO'],['06','POLÍTICAS']];const initial={companies:[{id:'wonder',name:'WONDER PACK S.A.S.',nit:'901220531',city:'Medellín',employees:30,risk:'IV',arl:'ARL SURA',subfolders:{}}],docs:[],alerts:[]};let state=JSON.parse(localStorage.getItem(KEY)||'null')||initial,active='01',cid='wonder',subactive='';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function current(){return state.companies.find(x=>x.id==cid)||state.companies[0]}function subs(){let c=current();c.subfolders=c.subfolders||{};c.subfolders[active]=c.subfolders[active]||[];return c.subfolders[active]}function login(){let u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;if((u=='gladys'&&p=='GladysPro2026!')||(u=='empleada'&&p=='Empleada2026!')){localStorage.pc5='1';localStorage.user5=u;show()}else document.getElementById('err').textContent='Usuario o contraseña incorrectos.'}function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').textContent=localStorage.user5;let cs=document.getElementById('company');cs.innerHTML=state.companies.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');cs.value=cid;cs.onchange=()=>{cid=cs.value;active='01';subactive='';render()};document.getElementById('folders').innerHTML=F.map(x=>{let open=x[0]==active;return `<button class="folder ${open&&!subactive?'active':''}" onclick="setFolder('${x[0]}')">${x[0]} · ${x[1]} <small>${state.docs.filter(d=>d.companyId==cid&&d.folder==x[0]).length}</small></button>${open?`<button class="newsub" onclick="newSubfolder()">＋ Nueva subcarpeta</button>${subs().map(s=>`<button class="folder sub ${subactive==s.id?'active':''}" onclick="setSub('${s.id}')">📁 ${s.name}<small>${state.docs.filter(d=>d.companyId==cid&&d.folder==active&&d.subfolder==s.id).length}</small></button>`).join('')}`:''}`).join('');render()}function setFolder(x){active=x;subactive='';show()}function setSub(x){subactive=x;render()}function docs(){return state.docs.filter(d=>d.companyId==cid&&d.folder==active&&(!subactive||d.subfolder==subactive))}function modal(t,b){document.getElementById('modalbox').innerHTML=`<h2>${t}</h2>${b}`;document.getElementById('modal').style.display='grid'}function closeM(){document.getElementById('modal').style.display='none'}function render(){let c=current(),f=F.find(x=>x[0]==active),s=subs().find(x=>x.id==subactive),list=docs();document.getElementById('main').innerHTML=`<div class="hero"><div><small>${f[1]}${s?' · '+s.name:''}</small><h1>${c.name}</h1><p>${c.city||'Ciudad por definir'} · ${c.employees||0} trabajadores · Riesgo ${c.risk||'Por definir'} · ${c.arl||'Por definir'}</p></div><div class="actions"><button class="outline" onclick="newSubfolder()">＋ Nueva subcarpeta</button><button class="ai" onclick="openAI()">✦ Asistente IA</button></div></div><div class="cards"><div class="card"><small>TRABAJADORES</small><strong>${c.employees||0}</strong></div><div class="card"><small>CARPETAS</small><strong>6</strong></div><div class="card"><small>SUBCARPETAS</small><strong>${F.reduce((n,x)=>n+(c.subfolders&&c.subfolders[x[0]]?c.subfolders[x[0]].length:0),0)}</strong></div><div class="card"><small>DOCUMENTOS</small><strong>${state.docs.filter(d=>d.companyId==cid).length}</strong></div></div><section class="panel"><div class="panel-head"><div><h2>${s?'📁 '+s.name:f[1]}</h2><p>${s?'Documentos de esta subcarpeta.':'Puedes crear todas las subcarpetas que necesites.'}</p></div><button class="outline" onclick="newDoc()">＋ Crear documento</button></div><table><thead><tr><th>CÓDIGO</th><th>NOMBRE</th><th>TIPO</th><th>VERSIÓN</th><th>ESTADO</th></tr></thead><tbody>${list.map(d=>`<tr><td>${d.code}</td><td>${d.name}</td><td>${d.type}</td><td>${d.version}</td><td>${d.status}</td></tr>`).join('')||'<tr><td colspan="5">Sin documentos todavía.</td></tr>'}</tbody></table></section>`}function newSubfolder(){let f=F.find(x=>x[0]==active);modal('📁 Nueva subcarpeta',`<p>Dentro de <b>${f[1]}</b> para <b>${current().name}</b>.</p><input id="sname" placeholder="Ej.: 01.01 Información general"><input id="scode" placeholder="Código opcional"><div class="row"><button class="primary" onclick="saveSubfolder()">Crear subcarpeta</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}function saveSubfolder(){let n=document.getElementById('sname').value.trim();if(!n)return alert('Escribe el nombre de la subcarpeta.');let id='s'+Date.now();subs().push({id,name:n,code:document.getElementById('scode').value.trim()});save();subactive=id;closeM();show()}function newCompany(){modal('🏢 Nueva empresa',`<input id="cname" placeholder="Razón social"><input id="cnit" placeholder="NIT"><input id="ccity" placeholder="Ciudad"><input id="cemployees" type="number" placeholder="Trabajadores"><select id="crisk"><option value="">Riesgo</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option></select><input id="carl" placeholder="ARL"><div class="row"><button class="primary" onclick="saveCompany()">Crear empresa</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}function saveCompany(){let n=document.getElementById('cname').value.trim();if(!n)return alert('Escribe el nombre.');let id='c'+Date.now();state.companies.push({id,name:n,nit:document.getElementById('cnit').value.trim(),city:document.getElementById('ccity').value.trim(),employees:+document.getElementById('cemployees').value||0,risk:document.getElementById('crisk').value||'Por definir',arl:document.getElementById('carl').value.trim()||'Por definir',subfolders:{}});cid=id;active='01';subactive='';save();closeM();show()}function newDoc(){let f=F.find(x=>x[0]==active),s=subs().find(x=>x.id==subactive);modal('📄 Crear documento',`<p>Destino: <b>${f[1]}${s?' / '+s.name:''}</b></p><select id="dtype"><option>Procedimiento</option><option>Programa</option><option>Política</option><option>Formato</option><option>Acta</option><option>Informe</option><option>Plan</option><option>Manual</option><option>Matriz</option></select><input id="dname" placeholder="Nombre del documento"><input id="dcode" placeholder="Código"><div class="row"><button class="primary" onclick="saveDoc()">Crear y guardar</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}function saveDoc(){let n=document.getElementById('dname').value.trim()||'Documento sin nombre';state.docs.push({id:Date.now(),companyId:cid,folder:active,subfolder:subactive,type:document.getElementById('dtype').value,name:n,code:document.getElementById('dcode').value.trim()||'POR-ASIGNAR',version:'01',status:'BORRADOR'});save();closeM();show()}function openAI(){let f=F.find(x=>x[0]==active),s=subs().find(x=>x.id==subactive);modal('🤖 Asistente IA',`<p>Empresa: <b>${current().name}</b><br>Destino: <b>${f[1]}${s?' / '+s.name:''}</b></p><textarea id="q" style="height:120px" placeholder="Escribe qué documento necesitas"></textarea><div class="row"><button class="primary" onclick="askAI()">Procesar solicitud</button><button class="secondary" onclick="closeM()">Cerrar</button></div><div id="aout"></div>`)}function askAI(){let q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('aout').innerHTML=`<div class="panel"><b>Solicitud preparada</b><br><br>${q.replaceAll('<','&lt;')}<br><br>La generación automática de Word/Excel se conectará en la fase de servidor IA.</div>`}function logout(){localStorage.removeItem('pc5');location.reload()}if(localStorage.pc5=='1')show();</script></body></html>
