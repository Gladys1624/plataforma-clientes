<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATAFORMA CLIENTES</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#18231d}button,input,select,textarea{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;background:#edf3ef}.box{width:390px;background:#fff;padding:38px;border-radius:18px;box-shadow:0 18px 60px #173f2a18}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;background:#17663f;color:#fff;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{display:block}.brand small{color:#748078}.login h1{font-size:25px;margin:30px 0 6px}.login p{color:#748078;font-size:13px}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid #d8e0db;border-radius:9px}.primary{padding:12px 16px;background:#17663f;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.login .primary{width:100%;margin-top:8px}.error{color:#a33d2c;font-size:12px;margin-top:8px}
.app{display:none}.top{height:70px;background:#fff;border-bottom:1px solid #e0e6e2;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.top-right{font-size:13px;color:#66736b}.logout,.secondary{margin-left:10px;padding:8px 11px;border:1px solid #d7dfda;background:#fff;border-radius:8px;cursor:pointer}.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #e0e6e2;padding:20px 14px}.label{font-size:10px;font-weight:800;color:#89938d;letter-spacing:1px;margin:12px 9px 7px}.company{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:9px;background:#fff}.folder{width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:9px;margin:3px 0;color:#4c5a52;cursor:pointer}.folder.active{background:#eaf4ee;color:#17663f;font-weight:700}.folder small{float:right;color:#8b958f}
main{padding:30px;max-width:1450px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:10px;color:#17663f;font-weight:800;letter-spacing:1px}.hero h1{font-size:30px;margin:5px 0}.hero p{color:#748078;margin:0}.actions{display:flex;gap:8px}.ai{background:#17663f;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.outline{background:#fff;color:#17663f;border:1px solid #17663f;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e0e6e2;border-radius:13px}.card{padding:16px}.card small{color:#849089;font-size:10px;font-weight:800}.card strong{display:block;font-size:24px;margin:7px 0}.card span{font-size:11px;color:#748078}.red strong{color:#a33d2c}
.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #edf0ee;padding-bottom:12px;margin-bottom:13px}.panel h2{font-size:14px;margin:0 0 4px}.panel p{font-size:12px;color:#77827b;margin:0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid #dce4df;background:#f8faf9;border-radius:10px;padding:14px;text-align:left;cursor:pointer}.quick b{display:block;font-size:12px}.quick span{display:block;font-size:11px;color:#718078;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;color:#818c85;padding:9px;border-bottom:1px solid #dfe5e1}td{padding:11px 9px;border-bottom:1px solid #edf0ee}.pill{font-size:9px;font-weight:800;color:#17663f}.alert{display:grid;grid-template-columns:220px 1fr 60px;gap:12px;padding:12px 4px;border-bottom:1px solid #edf0ee;font-size:12px}.alert span{color:#69766f}.alert em{font-style:normal;font-size:9px;font-weight:800;color:#a33d2c;text-align:right}
.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:10}.modalbox{width:min(650px,92vw);max-height:90vh;overflow:auto;background:#fff;padding:25px;border-radius:14px}.modalbox h2{margin-top:0}.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:8px;margin:6px 0}.row{display:flex;gap:9px;margin-top:10px}.result{margin-top:14px;background:#f5f8f6;border-radius:9px;padding:15px;font-size:12px;line-height:1.55}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.cards,.quick{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards,.quick{grid-template-columns:1fr}main{padding:18px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="login"><div class="box">
<div class="brand"><div class="mark">P</div><div><b>PLATAFORMA CLIENTES</b><small>Gestión inteligente integral</small></div></div>
<h1>Ingreso privado</h1><p>Acceso para tu equipo.</p>
<input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña">
<button class="primary" onclick="login()">Ingresar</button><div id="err" class="error"></div>
</div></div>
<div id="app" class="app">
<header class="top"><div class="brand"><div class="mark">P</div><div><b>PLATAFORMA CLIENTES</b><small>Gestión inteligente integral</small></div></div><div class="top-right"><span id="who"></span><button class="logout" onclick="logout()">Salir</button></div></header>
<div class="layout"><aside><div class="label">EMPRESA</div><select id="company" class="company"></select><div class="label">EXPEDIENTE</div><div id="folders"></div></aside><main id="main"></main></div></div>
<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY="pc_v5";
const F=[["01","ORGANIZACIÓN"],["02","PLANIFICACIÓN"],["03","APLICACIÓN"],["04","VERIFICACIÓN"],["05","MEJORAMIENTO"],["06","POLÍTICAS"]];
const initial={companies:[{id:"wonder",name:"WONDER PACK S.A.S.",nit:"901220531",city:"Medellín",employees:30,risk:"IV",arl:"ARL SURA"}],docs:[],alerts:[]};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||initial,active="01",cid="wonder";
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const loginScreen=document.getElementById("login");
const appScreen=document.getElementById("app");
const userInput=document.getElementById("user");
const passInput=document.getElementById("pass");
const errBox=document.getElementById("err");
const whoBox=document.getElementById("who");
const companySelect=document.getElementById("company");
const foldersBox=document.getElementById("folders");
const mainBox=document.getElementById("main");
const modalScreen=document.getElementById("modal");
const modalBox=document.getElementById("modalbox");

function login(){const u=userInput.value.trim();const p=passInput.value;if((u=="gladys"&&p=="GladysPro2026!")||(u=="empleada"&&p=="Empleada2026!")){localStorage.pc5="1";localStorage.user5=u;show()}else errBox.textContent="Usuario o contraseña incorrectos."}
function current(){return state.companies.find(x=>x.id==cid)||state.companies[0]}
function show(){loginScreen.style.display="none";appScreen.style.display="block";whoBox.textContent=localStorage.user5;companySelect.innerHTML=state.companies.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");companySelect.value=cid;companySelect.onchange=()=>{cid=companySelect.value;render()};foldersBox.innerHTML=F.map(x=>`<button class="folder ${x[0]==active?"active":""}" onclick="setFolder('${x[0]}')">${x[0]} · ${x[1]} <small>${state.docs.filter(d=>d.companyId==cid&&d.folder==x[0]).length}</small></button>`).join("");render()}
function setFolder(x){active=x;show()}
function docs(){return state.docs.filter(d=>d.companyId==cid&&d.folder==active)}
function totalDocs(){return state.docs.filter(d=>d.companyId==cid).length}
function render(){let c=current(),f=F.find(x=>x[0]==active),list=docs();mainBox.innerHTML=`<div class="hero"><div><span class="eyebrow">${f[1]}</span><h1>${c.name}</h1><p>${c.city} · ${c.employees} trabajadores · Riesgo ${c.risk} · ${c.arl}</p></div><div class="actions"><button class="outline" onclick="newDoc()">＋ Crear documento</button><button class="ai" onclick="openAI()">✦ Asistente IA</button></div></div>
<div class="cards"><div class="card"><small>TRABAJADORES</small><strong>${c.employees}</strong><span>Centro de trabajo</span></div><div class="card"><small>SISTEMAS</small><strong>4</strong><span>SST · PESV · Calidad · Ambiental</span></div><div class="card"><small>CARPETAS</small><strong>6</strong><span>estructura fija</span></div><div class="card red"><small>DOCUMENTOS</small><strong>${totalDocs()}</strong><span>guardados</span></div></div>
<section class="panel"><div class="panel-head"><div><h2>${f[1]}</h2><p>Todo lo que crees aquí queda asociado a ${c.name}.</p></div></div><div class="quick"><button onclick="newDoc()"><b>📄 Crear documento</b><span>Guardar en ${f[1]}.</span></button><button onclick="uploadDoc()"><b>📎 Cargar documento</b><span>Incorporar archivo.</span></button><button onclick="openAI()"><b>🤖 Trabajar con IA</b><span>Preparar una solicitud.</span></button></div></section>
<section class="panel"><div class="panel-head"><div><h2>DOCUMENTOS</h2><p>Expediente de ${f[1]}.</p></div></div><table><thead><tr><th>CÓDIGO</th><th>NOMBRE</th><th>TIPO</th><th>VERSIÓN</th><th>ESTADO</th></tr></thead><tbody>${list.map(d=>`<tr><td>${d.code}</td><td>${d.name}</td><td>${d.type}</td><td>${d.version}</td><td><span class="pill">${d.status}</span></td></tr>`).join("")||`<tr><td colspan="5">Sin documentos todavía. Crea o carga el primero.</td></tr>`}</tbody></table></section>
<section class="panel"><div class="panel-head"><div><h2>LAS 6 CARPETAS</h2><p>Tu estructura de trabajo.</p></div></div>${F.map(x=>`<button class="folder ${x[0]==active?"active":""}" style="display:inline-block;width:31%;margin:4px" onclick="setFolder('${x[0]}')">${x[0]} · ${x[1]} <small>${state.docs.filter(d=>d.companyId==cid&&d.folder==x[0]).length}</small></button>`).join("")}</section>`}
function modal(t,b){modalBox.innerHTML=`<h2>${t}</h2>${b}`;modalScreen.style.display="grid"} function closeM(){modalScreen.style.display="none"}
function newDoc(){let f=F.find(x=>x[0]==active);modal("📄 Crear documento",`<p>Empresa: <b>${current().name}</b><br>Carpeta: <b>${f[1]}</b></p><select id="dtype"><option>Procedimiento</option><option>Programa</option><option>Política</option><option>Formato</option><option>Acta</option><option>Informe</option><option>Plan</option><option>Manual</option><option>Matriz</option></select><input id="dname" placeholder="Nombre del documento"><input id="dcode" placeholder="Código documental"><textarea id="dnote" placeholder="Descripción / instrucciones"></textarea><div class="row"><button class="primary" onclick="saveDoc()">Crear y guardar</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function saveDoc(){let name=document.getElementById("dname").value.trim()||"Documento sin nombre",code=document.getElementById("dcode").value.trim()||"POR-ASIGNAR";state.docs.push({id:Date.now(),companyId:cid,folder:active,type:document.getElementById("dtype").value,name,code,version:"01",status:"BORRADOR",created:new Date().toISOString()});save();closeM();show()}
function uploadDoc(){modal("📎 Cargar documento",`<p>Empresa: <b>${current().name}</b><br>Destino: <b>${F.find(x=>x[0]==active)[1]}</b></p><input id="up" type="file"><div class="row"><button class="primary" onclick="storeUpload()">Registrar documento</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function storeUpload(){let file=document.getElementById("up").files[0];if(!file)return alert("Selecciona un archivo.");state.docs.push({id:Date.now(),companyId:cid,folder:active,type:"CARGADO",name:file.name,code:"CARGADO",version:"01",status:"CARGADO",created:new Date().toISOString()});save();closeM();show()}
function openAI(){let c=current(),f=F.find(x=>x[0]==active);modal("🤖 Asistente IA",`<p>Empresa: <b>${c.name}</b><br>Carpeta: <b>${f[1]}</b></p><textarea id="q" style="width:100%;height:130px;padding:11px;border:1px solid #d7dfda;border-radius:8px" placeholder="Ej.: créame el procedimiento de manejo seguro de bisturí"></textarea><div class="row"><button class="primary" onclick="askAI()">Procesar solicitud</button><button class="secondary" onclick="closeM()">Cerrar</button></div><div id="aout"></div>`)}
function askAI(){let q=document.getElementById("q").value.trim();if(!q)return;document.getElementById("aout").innerHTML=`<div class="result"><b>Solicitud preparada.</b><br><br>Empresa: ${current().name}<br>Carpeta: ${F.find(x=>x[0]==active)[1]}<br>Solicitud: ${q.replaceAll("<","&lt;")}<br><br><span style="color:#a33d2c">Motor IA: pendiente de conexión al servicio de IA en el despliegue.</span></div>`}
function logout(){localStorage.removeItem("pc5");localStorage.removeItem("user5");location.reload()}
if(localStorage.pc5=="1")show();
</script></body></html>
