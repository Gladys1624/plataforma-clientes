round:#eef5f0;color:#176b43;font-size:9px;font-weight:700;margin:2px}.search{max-width:300px}.hide{display:none!important}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:210px 1fr}}@media(max-width:750px){.layout{grid-template-columns:1fr}aside{display:none}.cards{grid-template-columns:1fr 1fr}.hero{flex-direction:column}.cols2,.grid{grid-template-columns:1fr}.main{padding:17px}}@media(max-width:500px){.cards{grid-template-columns:1fr}.loginbox{width:92vw}}

<div id="app" class="app"><header class="top"><div class="brand"><div class="logo">P</div><div><b>PLATAFORMA CLIENTES</b><small>Gestión inteligente integral</small></div></div><div class="topright"><span id="userlabel"></span><button class="btn secondary" onclick="backup()">💾 Respaldo</button><button class="btn secondary" onclick="logout()">Salir</button></div></header><div class="layout"><aside><div class="label">EMPRESA ACTIVA</div><select id="company" class="company" onchange="changeCompany()"></select><button class="btn primary newco" onclick="newCompany()">＋ Nueva empresa</button><div class="label">GESTIÓN</div><div id="nav"></div><div class="label">HERRAMIENTAS</div><button class="nav" onclick="backup()">💾 Copia de seguridad</button><button class="nav" onclick="restore()">↩ Restaurar copia</button><button class="nav" onclick="settings()">⚙ Configuración</button></aside><main id="main" class="main"></main></div></div>

<script>
const KEY='PLATAFORMA_CLIENTES_V6';const NAV=[['dashboard','📊','Inicio'],['empresa','🏢','Empresa'],['trabajadores','👥','Trabajadores'],['documentos','📁','Documentos'],['matrices','📋','Matrices'],['legal','⚖️','Matriz legal'],['plan','🎯','Plan de trabajo'],['acciones','✅','Acciones'],['indicadores','📈','Indicadores'],['auditoria','🔎','Auditoría'],['ia','🤖','Asistente IA']];const FOLDERS=[['01','ORGANIZACIÓN'],['02','PLANIFICACIÓN'],['03','APLICACIÓN'],['04','VERIFICACIÓN'],['05','MEJORAMIENTO'],['06','POLÍTICAS']];const seed={companies:[{id:'wonder',name:'WONDER PACK S.A.S.',nit:'',city:'Medellín',activity:'Manufactura',employees:30,risk:'IV',arl:'ARL SURA',systems:['SST','PESV','Calidad','Ambiental'],created:new Date().toISOString()}],workers:[],docs:[],matrices:[],legal:[],actions:[],indicators:[],audits:[],settings:{companyId:'wonder'}};let S=JSON.parse(localStorage.getItem(KEY)||'null')||seed;S.companies??=[];S.workers??=[];S.docs??=[];S.matrices??=[];S.legal??=[];S.actions??=[];S.indicators??=[];S.audits??=[];S.settings??={};let cid=S.settings.companyId||S.companies[0]?.id||'wonder',page='dashboard';const $=id=>document.getElementById(id);function save(){S.settings.companyId=cid;localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function company(){return S.companies.find(x=>x.id===cid)||S.companies[0]||{name:'Sin empresa',employees:0,risk:'',arl:''}}function login(){let u=$('u').value.trim(),p=$('p').value;if((u==='gladys'&&p==='GladysPro2026!')||(u==='empleada'&&p==='Empleada2026!')){localStorage.setItem('PC_SESSION','1');localStorage.setItem('PC_USER',u);boot()}else $('loginerr').textContent='Usuario o contraseña incorrectos.'}function logout(){localStorage.removeItem('PC_SESSION');location.reload()}function boot(){$('login').style.display='none';$('app').style.display='block';$('userlabel').textContent=localStorage.getItem('PC_USER')||'';renderCompanySelect();renderNav();render()}function renderCompanySelect(){$('company').innerHTML=S.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('company').value=cid}function changeCompany(){cid=$('company').value;save();render()}function renderNav(){$('nav').innerHTML=NAV.map(n=>`<button class="nav ${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}<span>${count(n[0])||''}</span></button>`).join('')}function go(p){page=p;renderNav();render()}function count(p){if(p==='trabajadores')return S.workers.filter(x=>x.companyId===cid).length;if(p==='documentos')return S.docs.filter(x=>x.companyId===cid).length;if(p==='acciones')return S.actions.filter(x=>x.companyId===cid&&x.status!=='CERRADA').length;return ''}function head(title,sub,buttons=''){return `<div class="hero"><div><span class="eyebrow">${esc(company().name)}</span><h1>${title}</h1><p class="muted">${sub}</p></div><div class="actions">${buttons}</div></div>`}
function render(){if(page==='dashboard')return dashboard();if(page==='empresa')return empresa();if(page==='trabajadores')return workers();if(page==='documentos')return documents();if(page==='matrices')return matrices();if(page==='legal')return legal();if(page==='plan')return plan();if(page==='acciones')return actions();if(page==='indicadores')return indicators();if(page==='auditoria')return audit();if(page==='ia')return ai()}
function dashboard(){let c=company(),docs=S.docs.filter(x=>x.companyId===cid),acts=S.actions.filter(x=>x.companyId===cid&&x.status!=='CERRADA'),workers=S.workers.filter(x=>x.companyId===cid);$('main').innerHTML=head('Panel de control','Vista general del expediente integral.',`<button class="btn primary" onclick="newDoc()">＋ Documento</button><button class="btn secondary" onclick="newCompany()">＋ Empresa</button>`)+`<div class="cards"><div class="card"><small>TRABAJADORES</small><strong>${c.employees||workers.length||0}</strong><span>${workers.length} registrados en detalle</span></div><div class="card"><small>DOCUMENTOS</small><strong>${docs.length}</strong><span>en el expediente</span></div><div class="card"><small>ACCIONES ABIERTAS</small><strong>${acts.length}</strong><span>por gestionar</span></div><div class="card"><small>SISTEMAS</small><strong>${(c.systems||[]).length||4}</strong><span>SST · PESV · Calidad · Ambiental</span></div><div class="card red"><small>CARPETAS</small><strong>6</strong><span>estructura documental</span></div></div><section class="panel"><div class="panelhead"><div><h2>Acciones rápidas</h2><p>Empieza a trabajar sin salir de la empresa.</p></div></div><div class="grid"><button class="quick" onclick="newDoc()"><b>📄 Crear documento</b><span>Procedimiento, programa, política, acta, informe, formato o manual.</span></button><button class="quick" onclick="newMatrix()"><b>📋 Crear matriz</b><span>Riesgos, legal, aspectos, objetivos o cualquier matriz.</span></button><button class="quick" onclick="go('ia')"><b>🤖 Asistente IA</b><span>Construir contenido a partir de los datos de la empresa.</span></button><button class="quick" onclick="newWorker()"><b>👤 Registrar trabajador</b><span>Hoja básica y seguimiento del personal.</span></button><button class="quick" onclick="newAction()"><b>✅ Nueva acción</b><span>Correctiva, preventiva o de mejora.</span></button><button class="quick" onclick="backup()"><b>💾 Respaldar todo</b><span>Descargar la información de la plataforma.</span></button></div></section><section class="panel"><div class="panelhead"><div><h2>Las 6 carpetas</h2><p>Organización documental integrada.</p></div></div>${FOLDERS.map(f=>`<span class="tag">${f[0]} · ${f[1]}</span>`).join('')}</section>`}
function empresa(){let c=company();$('main').innerHTML=head('Ficha de empresa','Datos maestros que alimentan documentos, matrices e indicadores.',`<button class="btn primary" onclick="editCompany()">✏️ Editar</button>`)+`<section class="panel"><div class="cols2"><div><b>Razón social</b><div>${esc(c.name)}</div></div><div><b>NIT</b><div>${esc(c.nit)||'Pendiente'}</div></div><div><b>Ciudad</b><div>${esc(c.city)||'Pendiente'}</div></div><div><b>Actividad / CIIU</b><div>${esc(c.activity)||'Pendiente'}</div></div><div><b>Trabajadores</b><div>${c.employees||0}</div></div><div><b>Clase de riesgo</b><div>${esc(c.risk)||'Pendiente'}</div></div><div><b>ARL</b><div>${esc(c.arl)||'Pendiente'}</div></div><div><b>Turnos / horarios</b><div>${esc(c.schedules)||'Pendiente'}</div></div><div><b>Personal</b><div>${esc(c.workforce)||'Pendiente'}</div></div><div><b>Procesos</b><div>${esc(c.processes)||'Pendiente'}</div></div></div></section><section class="panel"><div class="panelhead"><div><h2>Sistemas gestionados</h2><p>Seleccionados para esta empresa.</p></div></div>${(c.systems||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')}</section>`}
function workers(){let a=S.workers.filter(x=>x.companyId===cid);$('main').innerHTML=head('Trabajadores','Registro básico y seguimiento del personal.',`<button class="btn primary" onclick="newWorker()">＋ Trabajador</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>NOMBRE</th><th>CARGO</th><th>TIPO</th><th>ÁREA</th><th>ESTADO</th><th>INGRESO</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.position)}</td><td>${esc(x.type)}</td><td>${esc(x.area)}</td><td>${esc(x.status)}</td><td>${esc(x.date)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No hay trabajadores registrados.</td></tr>`}</tbody></table></div></section>`}
function documents(){let a=S.docs.filter(x=>x.companyId===cid);$('main').innerHTML=head('Gestión documental','Expediente completo por empresa y carpeta.',`<button class="btn primary" onclick="newDoc()">＋ Crear</button><button class="btn secondary" onclick="upload()">📎 Cargar</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>CÓDIGO</th><th>DOCUMENTO</th><th>CARPETA</th><th>VERSIÓN</th><th>ESTADO</th><th>FECHA</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(folderName(x.folder))}</td><td>${esc(x.version)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.date)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No hay documentos. Crea el primero con la IA o manualmente.</td></tr>`}</tbody></table></div></section><section class="panel"><h2>Carpetas</h2><p class="muted">${FOLDERS.map(f=>`<span class="tag">${f[0]} · ${f[1]} (${a.filter(x=>x.folder===f[0]).length})</span>`).join('')}</p></section>`}function folderName(id){return FOLDERS.find(x=>x[0]===id)?.[1]||id}
function matrices(){let a=S.matrices.filter(x=>x.companyId===cid);$('main').innerHTML=head('Matrices','Matrices de gestión con estructura editable y trazabilidad.',`<button class="btn primary" onclick="newMatrix()">＋ Nueva matriz</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>NOMBRE</th><th>TIPO</th><th>FILAS</th><th>ESTADO</th><th>FECHA</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${x.rows?.length||0}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.date)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">No hay matrices creadas.</td></tr>`}</tbody></table></div></section>`}
function legal(){let a=S.legal.filter(x=>x.companyId===cid);$('main').innerHTML=head('Matriz legal','Control de requisitos aplicables, evidencia y cumplimiento.',`<button class="btn primary" onclick="newLegal()">＋ Requisito</button><button class="btn secondary" onclick="exportLegal()">⬇ CSV</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>NORMA</th><th>TEMA</th><th>APLICA</th><th>CUMPLIMIENTO</th><th>EVIDENCIA</th><th>ACCIÓN</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.norm)}</td><td>${esc(x.topic)}</td><td>${esc(x.applies)}</td><td>${esc(x.compliance)}</td><td>${esc(x.evidence)}</td><td>${esc(x.action)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No hay requisitos registrados.</td></tr>`}</tbody></table></div></section>`}
function plan(){actions();}function actions(){let a=S.actions.filter(x=>x.companyId===cid);$('main').innerHTML=head('Plan de trabajo y acciones','Actividades, responsables, fechas, recursos y seguimiento.',`<button class="btn primary" onclick="newAction()">＋ Actividad</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>TIPO</th><th>ACTIVIDAD</th><th>RESPONSABLE</th><th>FECHA</th><th>PRIORIDAD</th><th>ESTADO</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.title)}</td><td>${esc(x.owner)}</td><td>${esc(x.due)}</td><td>${esc(x.priority)}</td><td>${esc(x.status)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No hay actividades registradas.</td></tr>`}</tbody></table></div></section>`}
function indicators(){let a=S.indicators.filter(x=>x.companyId===cid);$('main').innerHTML=head('Indicadores','Registro de metas, resultados, fórmula y análisis.',`<button class="btn primary" onclick="newIndicator()">＋ Indicador</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>INDICADOR</th><th>FÓRMULA</th><th>META</th><th>RESULTADO</th><th>PERIODO</th><th>ANÁLISIS</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.formula)}</td><td>${esc(x.target)}</td><td>${esc(x.result)}</td><td>${esc(x.period)}</td><td>${esc(x.analysis)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No hay indicadores registrados.</td></tr>`}</tbody></table></div></section>`}
function audit(){let a=S.audits.filter(x=>x.companyId===cid);$('main').innerHTML=head('Auditoría','Preparación, hallazgos, evidencias y seguimiento.',`<button class="btn primary" onclick="newAudit()">＋ Auditoría</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>AUDITORÍA</th><th>FECHA</th><th>ALCANCE</th><th>HALLAZGOS</th><th>ESTADO</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.date)}</td><td>${esc(x.scope)}</td><td>${esc(x.findings)}</td><td>${esc(x.status)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">No hay auditorías registradas.</td></tr>`}</tbody></table></div></section>`}
function ai(){let c=company();$('main').innerHTML=head('Asistente IA','Prepara solicitudes con el contexto de la empresa.',`<button class="btn secondary" onclick="copyPrompt()">📋 Copiar solicitud</button>`)+`<section class="panel"><div class="panelhead"><div><h2>¿Qué necesitas crear?</h2><p>La plataforma conserva el contexto de la empresa.</p></div></div><textarea id="aiprompt" class="field" style="height:180px" placeholder="Ej.: Analiza el SG-SST de esta empresa desde cero y propón los documentos, matrices, programas, registros e indicadores. No inventes datos; marca PENDIENTE lo que falte."></textarea><div class="row"><button class="btn primary" onclick="prepareAI()">🤖 Preparar trabajo IA</button><button class="btn secondary" onclick="newDoc()">📄 Crear documento</button></div><div id="airesult"></div></section><section class="panel"><h2>Contexto</h2><div class="result">Empresa: <b>${esc(c.name)}</b><br>NIT: ${esc(c.nit)||'PENDIENTE'}<br>Ciudad: ${esc(c.city)||'PENDIENTE'}<br>Actividad: ${esc(c.activity)||'PENDIENTE'}<br>Trabajadores: ${c.employees||'PENDIENTE'}<br>Riesgo: ${esc(c.risk)||'PENDIENTE'}<br>ARL: ${esc(c.arl)||'PENDIENTE'}<br>Sistemas: ${(c.systems||[]).join(', ')}</div></section>`}function copyPrompt(){navigator.clipboard?.writeText($('aiprompt')?.value||'Analiza esta empresa y ayúdame a construir su sistema integral.');alert('Solicitud copiada.')}function prepareAI(){let q=$('aiprompt').value.trim();if(!q)return alert('Escribe la solicitud.');$('airesult').innerHTML=`<div class="result"><b>Solicitud lista para IA.</b><br><br>${esc(q)}<br><br>Contexto: ${esc(company().name)} · ${company().employees||0} trabajadores · Riesgo ${esc(company().risk)||'PENDIENTE'}.<br><br><b>Regla:</b> no inventar datos; señalar faltantes.</div>`;navigator.clipboard?.writeText(q)}
function modal(t,b){$('modalbox').innerHTML=`<h2>${t}</h2>${b}`;$('modal').style.display='grid'}function closeM(){$('modal').style.display='none'}function newCompany(){modal('🏢 Nueva empresa',`<p class="muted">Se crea el expediente en esta misma plataforma.</p><div class="cols2"><input id="cn" class="field" placeholder="Razón social"><input id="nit" class="field" placeholder="NIT"><input id="city" class="field" placeholder="Ciudad"><input id="act" class="field" placeholder="Actividad / CIIU"><input id="emp" class="field" type="number" placeholder="Trabajadores"><select id="risk" class="field"><option value="">Clase de riesgo</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option></select><input id="arl" class="field" placeholder="ARL"><input id="sched" class="field" placeholder="Horarios / turnos"><input id="workforce" class="field" placeholder="Administrativos / operativos / contratistas"></div><textarea id="proc" class="field" placeholder="Procesos principales"></textarea><div class="check"><input type="checkbox" id="sst" checked>SST</div><div class="check"><input type="checkbox" id="pesv">PESV</div><div class="check"><input type="checkbox" id="quality">Calidad</div><div class="check"><input type="checkbox" id="env">Ambiental</div><div class="row"><button class="btn primary" onclick="saveCompany()">Crear empresa</button><button class="btn secondary" onclick="closeM()">Cancelar</button></div>`)}function saveCompany(){let name=$('cn').value.trim();if(!name)return alert('Escribe la razón social.');let c={id:'c'+Date.now(),name,nit:$('nit').value.trim(),city:$('city').value.trim(),activity:$('act').value.trim(),employees:+$('emp').value||0,risk:$('risk').value||'PENDIENTE',arl:$('arl').value.trim()||'PENDIENTE',schedules:$('sched').value.trim(),workforce:$('workforce').value.trim(),processes:$('proc').value.trim(),systems:[]};if($('sst').checked)c.systems.push('SST');if($('pesv').checked)c.systems.push('PESV');if($('quality').checked)c.systems.push('Calidad');if($('env').checked)c.systems.push('Ambiental');S.companies.push(c);cid=c.id;save();closeM();boot();setTimeout(()=>go('ia'),100)}function editCompany(){let c=company();modal('✏️ Editar empresa',`<input id="en" class="field" value="${esc(c.name)}" placeholder="Razón social"><input id="enit" class="field" value="${esc(c.nit)}" placeholder="NIT"><input id="ecity" class="field" value="${esc(c.city)}" placeholder="Ciudad"><input id="eact" class="field" value="${esc(c.activity)}" placeholder="Actividad"><input id="eemp" class="field" type="number" value="${c.employees||0}" placeholder="Trabajadores"><input id="earl" class="field" value="${esc(c.arl)}" placeholder="ARL"><input id="erisk" class="field" value="${esc(c.risk)}" placeholder="Riesgo"><input id="esched" class="field" value="${esc(c.schedules)}" placeholder="Horarios"><textarea id="eproc" class="field">${esc(c.processes)}</textarea><button class="btn primary" onclick="saveEdit()">Guardar</button>`)}function saveEdit(){let c=company();c.name=$('en').value.trim();c.nit=$('enit').value.trim();c.city=$('ecity').value.trim();c.activity=$('eact').value.trim();c.employees=+$('eemp').value||0;c.arl=$('earl').value.trim();c.risk=$('erisk').value.trim();c.schedules=$('esched').value.trim();c.processes=$('eproc').value.trim();save();closeM();boot()}
function newWorker(){modal('👤 Registrar trabajador',`<input id="wn" class="field" placeholder="Nombre completo"><input id="wp" class="field" placeholder="Cargo"><select id="wt" class="field"><option>Empleado</option><option>Contratista</option><option>Aprendiz</option></select><input id="wa" class="field" placeholder="Área"><input id="wd" class="field" type="date"><select id="ws" class="field"><option>ACTIVO</option><option>INACTIVO</option></select><button class="btn primary" onclick="saveWorker()">Guardar trabajador</button>`)}function saveWorker(){let name=$('wn').value.trim();if(!name)return alert('Escribe el nombre.');S.workers.push({id:Date.now(),companyId:cid,name,position:$('wp').value.trim(),type:$('wt').value,area:$('wa').value.trim(),date:$('wd').value,status:$('ws').value});save();closeM();renderNav();render()}
function newDoc(){modal('📄 Crear documento',`<select id="df" class="field">${FOLDERS.map(f=>`<option value="${f[0]}">${f[0]} · ${f[1]}</option>`).join('')}</select><select id="dt" class="field"><option>Procedimiento</option><option>Programa</option><option>Política</option><option>Manual</option><option>Formato</option><option>Acta</option><option>Informe</option><option>Plan</option><option>Matriz</option><option>Instructivo</option></select><input id="dn" class="field" placeholder="Nombre del documento"><input id="dc" class="field" placeholder="Código"><input id="dv" class="field" value="01" placeholder="Versión"><textarea id="dd" class="field" placeholder="Objetivo / contenido / instrucciones"></textarea><button class="btn primary" onclick="saveDoc()">Crear y guardar</button>`)}function saveDoc(){let name=$('dn').value.trim();if(!name)return alert('Escribe el nombre.');S.docs.push({id:Date.now(),companyId:cid,folder:$('df').value,type:$('dt').value,name,code:$('dc').value.trim()||'POR-ASIGNAR',version:$('dv').value.trim()||'01',status:'BORRADOR',date:new Date().toLocaleDateString('es-CO'),content:$('dd').value});save();closeM();go('documentos')}
function upload(){modal('📎 Registrar documento cargado',`<input id="uf" class="field" type="file"><select id="udf" class="field">${FOLDERS.map(f=>`<option value="${f[0]}">${f[0]} · ${f[1]}</option>`).join('')}</select><input id="uc" class="field" placeholder="Código documental"><button class="btn primary" onclick="saveUpload()">Registrar</button>`)}function saveUpload(){let f=$('uf').files[0];if(!f)return alert('Selecciona un archivo.');S.docs.push({id:Date.now(),companyId:cid,folder:$('udf').value,type:'ARCHIVO',name:f.name,code:$('uc').value||'CARGADO',version:'01',status:'CARGADO',date:new Date().toLocaleDateString('es-CO'),size:f.size});save();closeM();go('documentos')}
function newMatrix(){modal('📋 Nueva matriz',`<input id="mn" class="field" placeholder="Nombre de la matriz"><select id="mt" class="field"><option>Identificación de peligros y valoración de riesgos</option><option>Matriz legal</option><option>Objetivos e indicadores</option><option>Aspectos e impactos ambientales</option><option>Riesgos viales / PESV</option><option>Otra</option></select><textarea id="mcols" class="field" placeholder="Columnas separadas por coma. Ej.: Proceso,Peligro,Consecuencia,Controles,Valoración"></textarea><button class="btn primary" onclick="saveMatrix()">Crear matriz</button>`)}function saveMatrix(){let name=$('mn').value.trim();if(!name)return alert('Escribe el nombre.');S.matrices.push({id:Date.now(),companyId:cid,name,type:$('mt').value,columns:$('mcols').value.split(',').map(x=>x.trim()).filter(Boolean),rows:[],status:'BORRADOR',date:new Date().toLocaleDateString('es-CO')});save();closeM();go('matrices')}
function newLegal(){modal('⚖️ Requisito legal',`<input id="ln" class="field" placeholder="Norma / artículo"><input id="lt" class="field" placeholder="Tema / obligación"><select id="la" class="field"><option>SI</option><option>NO</option><option>POR REVISAR</option></select><select id="lc" class="field"><option>CUMPLE</option><option>NO CUMPLE</option><option>PARCIAL</option><option>NO EVALUADO</option></select><input id="le" class="field" placeholder="Evidencia"><textarea id="lact" class="field" placeholder="Acción requerida"></textarea><button class="btn primary" onclick="saveLegal()">Guardar requisito</button>`)}function saveLegal(){if(!$('ln').value.trim())return alert('Escribe la norma.');S.legal.push({id:Date.now(),companyId:cid,norm:$('ln').value,topic:$('lt').value,applies:$('la').value,compliance:$('lc').value,evidence:$('le').value,action:$('lact').value});save();closeM();go('legal')}
function newAction(){modal('✅ Nueva acción / actividad',`<select id="at" class="field"><option>Plan de trabajo</option><option>Correctiva</option><option>Preventiva</option><option>Mejora</option><option>Compromiso</option></select><input id="ati" class="field" placeholder="Actividad / acción"><input id="ao" class="field" placeholder="Responsable"><input id="ad" class="field" type="date"><select id="ap" class="field"><option>BAJA</option><option>MEDIA</option><option>ALTA</option><option>CRÍTICA</option></select><select id="as" class="field"><option>PENDIENTE</option><option>EN PROCESO</option><option>CERRADA</option></select><textarea id="an" class="field" placeholder="Recursos / observaciones"></textarea><button class="btn primary" onclick="saveAction()">Guardar</button>`)}function saveAction(){if(!$('ati').value.trim())return alert('Escribe la actividad.');S.actions.push({id:Date.now(),companyId:cid,type:$('at').value,title:$('ati').value,owner:$('ao').value,due:$('ad').value,priority:$('ap').value,status:$('as').value,note:$('an').value});save();closeM();go('acciones')}
function newIndicator(){modal('📈 Nuevo indicador',`<input id="in" class="field" placeholder="Nombre del indicador"><input id="if" class="field" placeholder="Fórmula"><input id="it" class="field" placeholder="Meta"><input id="ir" class="field" placeholder="Resultado"><input id="ip" class="field" placeholder="Periodo"><textarea id="iax" class="field" placeholder="Análisis y decisiones"></textarea><button class="btn primary" onclick="saveIndicator()">Guardar</button>`)}function saveIndicator(){if(!$('in').value.trim())return alert('Escribe el indicador.');S.indicators.push({id:Date.now(),companyId:cid,name:$('in').value,formula:$('if').value,target:$('it').value,result:$('ir').value,period:$('ip').value,analysis:$('iax').value});save();closeM();go('indicadores')}
function newAudit(){modal('🔎 Nueva auditoría',`<input id="aname" class="field" placeholder="Nombre / tipo de auditoría"><input id="adate" class="field" type="date"><input id="ascope" class="field" placeholder="Alcance"><input id="afind" class="field" type="number" min="0" placeholder="Número de hallazgos"><select id="ast" class="field"><option>PLANIFICADA</option><option>EN EJECUCIÓN</option><option>FINALIZADA</option></select><button class="btn primary" onclick="saveAudit()">Guardar</button>`)}function saveAudit(){S.audits.push({id:Date.now(),companyId:cid,name:$('aname').value,date:$('adate').value,scope:$('ascope').value,findings:+$('afind').value||0,status:$('ast').value});save();closeM();go('auditoria')}
function backup(){let payload={version:'6.0',created:new Date().toISOString(),platform:'PLATAFORMA CLIENTES',data:S};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RESPALDO_PLATAFORMA_CLIENTES_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function restore(){$('restorefile').click()}$('restorefile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data?.companies)throw 0;S=x.data;cid=S.companies[0]?.id;save();boot();alert('Respaldo restaurado correctamente.')}catch{alert('El archivo no es un respaldo válido.')}};r.readAsText(f)};function exportLegal(){let rows=[['Norma','Tema','Aplica','Cumplimiento','Evidencia','Acción'],...S.legal.filter(x=>x.companyId===cid).map(x=>[x.norm,x.topic,x.applies,x.compliance,x.evidence,x.action])];downloadCSV(rows,'MATRIZ_LEGAL.csv')}function downloadCSV(rows,name){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n'),b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}function settings(){modal('⚙️ Configuración',`<p class="muted">Respalda regularmente tu plataforma.</p><button class="btn primary" onclick="backup();closeM()">💾 Descargar respaldo</button><button class="btn secondary" onclick="closeM()">Cerrar</button>`)}if(localStorage.getItem('PC_SESSION')==='1')boot();
</script></body></html>
