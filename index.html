<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLATAFORMA CLIENTES V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7f5;color:#18231d}button,input,select,textarea{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;background:#edf3ef}.box{width:390px;background:#fff;padding:38px;border-radius:18px;box-shadow:0 18px 60px #173f2a18}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;background:#17663f;color:white;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{display:block}.brand small{color:#748078}.login h1{font-size:25px;margin:30px 0 6px}.login p{color:#748078;font-size:13px}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid #d8e0db;border-radius:9px}.primary{padding:12px 16px;background:#17663f;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.login .primary{width:100%;margin-top:8px}.error{color:#a33d2c;font-size:12px;margin-top:8px}
.app{display:none}.top{height:70px;background:#fff;border-bottom:1px solid #e0e6e2;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.top-right{font-size:13px;color:#66736b}.logout,.secondary{margin-left:10px;padding:8px 11px;border:1px solid #d7dfda;background:#fff;border-radius:8px;cursor:pointer}.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #e0e6e2;padding:20px 14px}.label{font-size:10px;font-weight:800;color:#89938d;letter-spacing:1px;margin:12px 9px 7px}.company{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:9px;background:#fff}.folder{width:100%;border:0;background:#fff;text-align:left;padding:12px;border-radius:9px;margin:3px 0;color:#4c5a52;cursor:pointer}.folder.active{background:#eaf4ee;color:#17663f;font-weight:700}.folder small{float:right;color:#8b958f}
main{padding:30px;max-width:1450px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:10px;color:#17663f;font-weight:800;letter-spacing:1px}.hero h1{font-size:30px;margin:5px 0}.hero p{color:#748078;margin:0}.actions{display:flex;gap:8px}.ai{background:#17663f;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.outline{background:#fff;color:#17663f;border:1px solid #17663f;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e0e6e2;border-radius:13px}.card{padding:16px}.card small{color:#849089;font-size:10px;font-weight:800}.card strong{display:block;font-size:24px;margin:7px 0}.card span{font-size:11px;color:#748078}.red strong{color:#a33d2c}
.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #edf0ee;padding-bottom:12px;margin-bottom:13px}.panel h2{font-size:14px;margin:0 0 4px}.panel p{font-size:12px;color:#77827b;margin:0}.folder-title{font-size:18px;font-weight:800;color:#17663f}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid #dce4df;background:#f8faf9;border-radius:10px;padding:14px;text-align:left;cursor:pointer}.quick b{display:block;font-size:12px}.quick span{display:block;font-size:11px;color:#718078;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;color:#818c85;padding:9px;border-bottom:1px solid #dfe5e1}td{padding:11px 9px;border-bottom:1px solid #edf0ee}.pill{font-size:9px;font-weight:800;color:#17663f}.alert{display:grid;grid-template-columns:220px 1fr 60px;gap:12px;padding:12px 4px;border-bottom:1px solid #edf0ee;font-size:12px}.alert span{color:#69766f}.alert em{font-style:normal;font-size:9px;font-weight:800;color:#a33d2c;text-align:right}
.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;z-index:10}.modalbox{width:min(620px,92vw);max-height:90vh;overflow:auto;background:#fff;padding:25px;border-radius:14px}.modalbox h2{margin-top:0}.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:11px;border:1px solid #d7dfda;border-radius:8px;margin:6px 0}.row{display:flex;gap:9px;margin-top:10px}.result{margin-top:14px;background:#f5f8f6;border-radius:9px;padding:15px;font-size:12px;line-height:1.55}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.cards,.quick{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards,.quick{grid-template-columns:1fr}main{padding:18px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="login"><div class="box">
<div class="brand"><div class="mark">P</div><div><b>PLATAFORMA CLIENTES</b><small>Gestión inteligente integral</small></div></div>
<h1>Ingreso privado</h1><p>Acceso para tu equipo.</p>
<input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña">
<button class="primary" onclick="login()">Ingresar</button><div id="err" class="error"></div>
</div></div>

<div id="app" class="app">
<header class="top"><div class="brand"><div class="mark">P</div><div><b>PLATAFORMA CLIENTES</b><small>Gestión inteligente integral</small></div></div><div class="top-right"><span id="who"></span><button class="logout" onclick="logout()">Salir</button></div></header>
<div class="layout">
<aside>
<div class="label">EMPRESA</div>
<select class="company"><option>WONDER PACK S.A.S.</option></select>
<div class="label">EXPEDIENTE</div>
<div id="folders"></div>
</aside>
<main id="main"></main>
</div>
</div>
<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const F=[["01","ORGANIZACIÓN"],["02","PLANIFICACIÓN"],["03","APLICACIÓN"],["04","VERIFICACIÓN"],["05","MEJORAMIENTO"],["06","POLÍTICAS"]];
let active="01";
let data=JSON.parse(localStorage.pcData||"{}");
function initData(){F.forEach(x=>{if(!data[x[0]])data[x[0]]=[]});localStorage.pcData=JSON.stringify(data)}
initData();
function login(){if((user.value=="gladys"&&pass.value=="GladysPro2026!")||(user.value=="empleada"&&pass.value=="Empleada2026!")){localStorage.pc="1";localStorage.who=user.value;show()}else err.textContent="Usuario o contraseña incorrectos."}
function show(){login.style.display="none";app.style.display="block";who.textContent=localStorage.who;folders.innerHTML=F.map(x=>`<button class="folder ${x[0]==active?"active":""}" onclick="setFolder('${x[0]}')">${x[0]} · ${x[1]} <small>${data[x[0]].length}</small></button>`).join("");render()}
function setFolder(x){active=x;show()}
function render(){let f=F.find(x=>x[0]==active),list=data[active];main.innerHTML=`
<div class="hero"><div><span class="eyebrow">${f[1]}</span><h1>WONDER PACK S.A.S.</h1><p>Medellín · 30 trabajadores · Riesgo IV · ARL SURA</p></div>
<div class="actions"><button class="outline" onclick="newDoc()">＋ Crear documento</button><button class="ai" onclick="ai()">✦ Asistente IA</button></div></div>
<div class="cards"><div class="card"><small>TRABAJADORES</small><strong>30</strong><span>1 centro de trabajo</span></div><div class="card"><small>SISTEMAS</small><strong>4</strong><span>SST · PESV · Calidad · Ambiental</span></div><div class="card"><small>CARPETAS</small><strong>6</strong><span>estructura fija</span></div><div class="card red"><small>DOCUMENTOS</small><strong>${totalDocs()}</strong><span>creados en la plataforma</span></div></div>
<section class="panel"><div class="panel-head"><div><h2>CARPETA ACTIVA</h2><p>Estás trabajando en <b>${f[1]}</b>.</p></div></div>
<div class="quick"><button onclick="newDoc()"><b>📄 Nuevo documento</b><span>Crear y guardar en ${f[1]}.</span></button><button onclick="uploadSim()"><b>📎 Cargar documento</b><span>Agregar un documento a esta carpeta.</span></button><button onclick="ai()"><b>🤖 Trabajar con IA</b><span>Solicitar creación o revisión.</span></button></div></section>
<section class="panel"><div class="panel-head"><div><h2>DOCUMENTOS DE ${f[1]}</h2><p>Los documentos creados quedan asociados a esta carpeta.</p></div></div>
<table><thead><tr><th>CÓDIGO</th><th>DOCUMENTO</th><th>TIPO</th><th>VERSIÓN</th><th>ESTADO</th></tr></thead><tbody>${list.map(d=>`<tr><td>${d.code}</td><td>${d.name}</td><td>${d.type}</td><td>${d.ver}</td><td><span class="pill">${d.status}</span></td></tr>`).join("")||`<tr><td colspan="5">Esta carpeta está lista para comenzar. Usa “Crear documento”.</td></tr>`}</tbody></table></section>
<section class="panel"><div class="panel-head"><div><h2>LAS 6 CARPETAS</h2><p>Acceso directo al expediente de WONDER PACK.</p></div></div>${F.map(x=>`<button class="folder ${x[0]==active?"active":""}" style="display:inline-block;width:31%;margin:4px" onclick="setFolder('${x[0]}')">${x[0]} · ${x[1]} <small>${data[x[0]].length}</small></button>`).join("")}</section>`}
function totalDocs(){return F.reduce((n,x)=>n+data[x[0]].length,0)}
function modal(t,b){modalbox.innerHTML=`<h2>${t}</h2>${b}`;modal.style.display="grid"}
function closeM(){modal.style.display="none"}
function newDoc(){modal("📄 Crear documento",`<p>Se guardará directamente en <b>${F.find(x=>x[0]==active)[1]}</b>.</p><select id="type"><option>Procedimiento</option><option>Programa</option><option>Política</option><option>Formato</option><option>Acta</option><option>Informe</option><option>Plan</option><option>Manual</option><option>Matriz</option></select><input id="name" placeholder="Nombre del documento"><input id="code" placeholder="Código documental"><div class="row"><button class="primary" onclick="saveDoc()">Crear y guardar</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function saveDoc(){let n=name.value.trim()||"Nuevo documento",c=code.value.trim()||"POR-ASIGNAR";data[active].push({code:c,name:n,type:type.value,ver:"01",status:"BORRADOR"});localStorage.pcData=JSON.stringify(data);closeM();show();alert("Documento creado en "+F.find(x=>x[0]==active)[1]+".")}
function uploadSim(){modal("📎 Cargar documento",`<p>Selecciona el archivo que deseas incorporar a <b>${F.find(x=>x[0]==active)[1]}</b>.</p><input type="file" id="file"><div class="row"><button class="primary" onclick="fakeUpload()">Agregar al expediente</button><button class="secondary" onclick="closeM()">Cancelar</button></div>`)}
function fakeUpload(){let f=file.files[0];if(!f)return alert("Selecciona un archivo.");data[active].push({code:"CARGADO",name:f.name,type:"Documento",ver:"01",status:"CARGADO"});localStorage.pcData=JSON.stringify(data);closeM();show();alert("Documento incorporado al expediente.");}
function ai(){modal("🤖 Asistente IA",`<p>Empresa: <b>WONDER PACK S.A.S.</b><br>Carpeta: <b>${F.find(x=>x[0]==active)[1]}</b></p><textarea id="q" style="width:100%;height:120px;padding:11px;border:1px solid #d7dfda;border-radius:8px" placeholder="Ej.: créame el procedimiento de manejo seguro de bisturí"></textarea><div class="row"><button class="primary" onclick="processAI()">Procesar solicitud</button><button class="secondary" onclick="closeM()">Cerrar</button></div><div id="aiout"></div>`)}
function processAI(){let q=document.getElementById("q").value.trim()||"Crear documento";document.getElementById("aiout").innerHTML=`<div class="result"><b>Solicitud preparada:</b><br>${q}<br><br><span style="color:#17663f">✓ Empresa: WONDER PACK S.A.S.</span><br><span style="color:#17663f">✓ Carpeta: ${F.find(x=>x[0]==active)[1]}</span><br><span style="color:#a33d2c">⚠ El motor IA productivo se conectará en la siguiente fase para generar el Word/Excel automáticamente.</span></div>`}
function logout(){localStorage.removeItem("pc");localStorage.removeItem("who");location.reload()}
if(localStorage.pc=="1")show();
</script>
</body>
</html>
